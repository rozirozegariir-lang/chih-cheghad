<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چی چقد؟</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #F5E6D3;
            color: #4A3728;
            text-align: center;
            padding-top: 100px;
            margin: 0;
        }
        .container {
            background: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #D4A574;
            font-size: 32px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #D4A574;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>چی چقد؟</h1>
        <p>اینجا قراره بفهمیم گنج‌های خونه‌ت چقد می‌ارزن! 🏺</p>
        <p>به زودی هوش مصنوعی رو اینجا فعال می‌کنیم...</p>
        <a href="#" class="btn">عکسش رو بذار</a>
    </div>

</body>
</html>
