    <style>

        #storyVideo { width: 95%; max-width: 400px; max-height: 80vh; border-radius: 15px; outline: none; }

        .tab-btn { flex: 1; padding: 8px 0; text-align: center; border: none; font-family: inherit; font-size: 10px; font-weight: bold; color: white; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; opacity: 0.75; }
        .tab-btn span { font-size: 17px; }
        .tab-btn.gallery-btn { background: var(--gallery-color); box-shadow: 0 4px 10px rgba(42, 157, 143, 0.3); }
        .tab-btn.teacher-btn { background: var(--teacher-color); box-shadow: 0 4px 10px rgba(46, 139, 87, 0.3); }
        .tab-btn.repair-btn { background: var(--repair-color); box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3); }
        .tab-btn.tasks-btn { background: var(--tasks-color); box-shadow: 0 4px 10px rgba(142, 68, 173, 0.3); }
        .tab-btn.chef-btn { background: var(--chef-color); box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); }
        .tab-btn.shop-btn { background: var(--shop-color); box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3); }

        .chat-img-btn { background: #fef4e8; color: var(--repair-color); border: 1px solid #f5d2b0; border-radius: 8px; padding: 0 10px; font-family: inherit; font-size: 13px; font-weight: bold; cursor: pointer; height: 40px; display: flex; justify-content: center; align-items: center; gap: 4px; white-space: nowrap; }

        .task-card { background: white; border-radius: 12px; padding: 10px; margin-bottom: 8px; box-shadow: 0 3px 8px rgba(0,0,0,0.05); text-align: right; border-right: 4px solid var(--tasks-color); }
