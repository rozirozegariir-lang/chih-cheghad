<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پنل ادمین | همیار زندگی</title>
    
    <!-- تنظیمات اپلیکیشن (PWA) برای پنل ادمین -->
    <link rel="manifest" href="/manifest-admin.json">
    <meta name="theme-color" content="#D4A574">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="مدیریت همیار">

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root { --primary: #D4A574; --primary-dark: #b88655; --danger: #E74C3C; --success: #2E8B57; --info: #2980B9; --text-main: #4A3728; --bg: #f4f7f6; --card: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background-color: var(--bg); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* --- صفحه ورود --- */
        .login-container { background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; width: 90%; max-width: 350px; margin: auto; }
        .login-input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 15px; text-align: center; font-family: inherit; font-size: 16px;}
        .login-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 16px;}
        
        /* --- داشبورد اصلی (منو) --- */
        .dashboard-container { display: none; width: 100%; max-width: 600px; margin: 0 auto; padding: 20px; flex-grow: 1; }
        .header-dash { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header-dash h2 { margin: 0; color: var(--primary-dark); font-size: 20px; }
        .logout-btn { background: #fce4e4; color: var(--danger); border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 13px; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .menu-card { background: var(--card); border: none; border-radius: 16px; padding: 25px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.04); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .menu-card:active { transform: scale(0.96); }
        .menu-card .icon { font-size: 35px; margin-bottom: 10px; }
        .menu-card .title { font-weight: bold; color: var(--text-main); font-size: 14px; }
        .menu-card.disabled { opacity: 0.5; pointer-events: none; }

        /* --- صفحات داخلی (پنل‌ها) --- */
        .inner-panel { display: none; background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .panel-header { display: flex; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eee; }
        .back-btn { background: #f0f0f0; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; color: var(--text-main); margin-left: 15px; }
        .back-btn:active { background: #e0e0e0; }
        .panel-header h3 { margin: 0; color: var(--primary-dark); font-size: 18px; }

        /* --- فرم‌ها --- */
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 13px; color: var(--text-main); }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; background: #f9f9f9; font-size: 14px;}
        textarea.form-control { resize: vertical; min-height: 80px; }
        
        .divider { text-align: center; margin: 10px 0; color: #999; font-size: 11px; position: relative; }
        .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 35%; height: 1px; background: #eee; }
        .divider::before { right: 0; }
        .divider::after { left: 0; }

        .submit-btn { background: var(--success); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; margin-top: 10px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 15px; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .submit-btn:disabled { opacity: 0.7; }
        .loader { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .status-msg { text-align: center; padding: 12px; border-radius: 10px; margin-top: 15px; display: none; font-weight: bold; font-size: 13px; }
        .status-msg.success { background: #d4edda; color: #155724; display: block; }
        .status-msg.error { background: #f8d7da; color: #721c24; display: block; }

        /* --- کارت‌های لیست --- */
        .manage-card { border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 12px; background: #fafafa; }
        .manage-card h4 { margin: 0 0 8px 0; color: var(--primary-dark); font-size: 15px; display: flex; justify-content: space-between; align-items: center;}
        .manage-card p { margin: 0 0 5px 0; font-size: 12px; color: #555;}
        .action-btn { padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 12px; cursor: pointer; border: none; color: white; font-weight: bold;}
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .badge { padding: 3px 8px; border-radius: 10px; font-size: 10px; }
        .badge.active { background: #d4edda; color: #2E8B57; }
        .badge.inactive { background: #fce4e4; color: #E74C3C; }

        /* --- ابزارها --- */
        .tool-card { display: flex; align-items: center; justify-content: space-between; background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px solid #eee; text-decoration: none; color: var(--text-main); font-weight: bold; font-size: 14px; margin-bottom: 10px;}
        .tool-card:active { background: #f0f0f0; }
    </style>
</head>
<body>
    <div id="loginBox" class="login-container">
        <h2 style="color: var(--primary-dark); margin-top: 0;">🔐 ورود به مدیریت</h2>
        <div id="loginError" style="color: var(--danger); display: none; margin-bottom: 10px; font-size: 13px;">رمز اشتباه است!</div>
        <input type="password" id="passwordInput" class="login-input" placeholder="رمز عبور...">
        <button class="login-btn" onclick="checkLogin()">ورود</button>
    </div>

    <div id="dashboardBox" class="dashboard-container">
        <div class="header-dash">
            <h2>پنل مدیریت همیار</h2>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>

        <!-- منوی اصلی اپلیکیشن -->
        <div id="mainMenu" class="menu-grid">
            <button class="menu-card" onclick="openPanel('usersPanel')">
                <span class="icon">👥</span><span class="title">کاربران</span>
            </button>
            <button class="menu-card" onclick="openPanel('productsPanel')">
                <span class="icon">📦</span><span class="title">محصولات (گالری)</span>
            </button>
            <button class="menu-card" onclick="openPanel('tasksPanel')">
                <span class="icon">🤝</span><span class="title">میکرو-کارها</span>
            </button>
            <button class="menu-card" onclick="openPanel('toolsPanel')">
                <span class="icon">🛠️</span><span class="title">ابزارها</span>
            </button>
            <!-- بخش‌های در حال توسعه -->
            <button class="menu-card disabled">
                <span class="icon">🛍️</span><span class="title">فروشگاه (بزودی)</span>
            </button>
            <button class="menu-card disabled">
                <span class="icon">👨‍🍳</span><span class="title">آشپز (بزودی)</span>
            </button>
        </div>

        <!-- ۱. پنل کاربران -->
        <div id="usersPanel" class="inner-panel">
            <div class="panel-header">
                <button class="back-btn" onclick="closePanel()">➔</button>
                <h3>مدیریت کاربران</h3>
            </div>
            <div id="usersList">
                <p style="text-align: center; color: #aaa;">در حال دریافت...</p>
            </div>
        </div>

        <!-- ۲. پنل محصولات -->
        <div id="productsPanel" class="inner-panel">
            <div class="panel-header">
                <button class="back-btn" onclick="closePanel()">➔</button>
                <h3>افزودن محصول</h3>
            </div>
            <div id="productStatusMsg" class="status-msg"></div>

            <div class="form-group"><label>عنوان *</label><input type="text" id="prodTitle" class="form-control" placeholder="مثلاً: اسلاید روسی..."></div>
            <div class="form-group"><label>قیمت *</label><input type="text" id="prodPrice" class="form-control" placeholder="مثلاً: ۲.۸۰۰.۰۰۰ تومان"></div>
            
            <div class="form-group">
                <label>عکس محصول *</label>
                <input type="file" id="prodImgFile" accept="image/*" class="form-control" style="background: white; margin-bottom: 5px;">
                <div class="divider">یا لینک بده</div>
                <input type="text" id="prodImgUrl" class="form-control" placeholder="لینک عکس را پیست کنید">
            </div>
            
            <div class="form-group">
                <label>ویدیو (اختیاری)</label>
                <input type="file" id="prodVidFile" accept="video/*" class="form-control" style="background: white; margin-bottom: 5px;">
                <div class="divider">یا لینک بده</div>
                <input type="text" id="prodVidUrl" class="form-control" placeholder="لینک ویدیو را پیست کنید">
            </div>
            
            <button class="submit-btn" id="addProductBtn" onclick="addProduct()">ثبت محصول</button>
        </div>

        <!-- ۳. پنل میکرو-کارها -->
        <div id="tasksPanel" class="inner-panel">
            <div class="panel-header">
                <button class="back-btn" onclick="closePanel()">➔</button>
                <h3>مدیریت میکرو-کارها</h3>
            </div>
            <div id="tasksList">
                <p style="text-align: center; color: #aaa;">در حال دریافت...</p>
            </div>
        </div>

        <!-- ۴. پنل ابزارها -->
        <div id="toolsPanel" class="inner-panel">
            <div class="panel-header">
                <button class="back-btn" onclick="closePanel()">➔</button>
                <h3>ابزارهای مدیریتی</h3>
            </div>
            
            <a href="https://console.neon.tech" target="_blank" class="tool-card">
                <span>🐘 دیتابیس Neon</span><span>↗</span>
            </a>
            <a href="https://vercel.com/dashboard" target="_blank" class="tool-card">
                <span>▲ داشبورد Vercel</span><span>↗</span>
            </a>
            <a href="https://github.com/rozirozegariir-lang/chih-cheghad" target="_blank" class="tool-card">
                <span>🐙 مخزن گیت‌هاب</span><span>↗</span>
            </a>
            <a href="https://diirin.ir/devdor/" target="_blank" class="tool-card">
                <span>🛠️ پنل کنترل دیرین</span><span>↗</span>
            </a>
            <a href="https://diirin.ir/bio/admin.php" target="_blank" class="tool-card">
                <span>🔗 پنل صفحه اختصاصی</span><span>↗</span>
            </a>
            <a href="https://diirin.ir:2096/" target="_blank" class="tool-card">
                <span>📧 پنل ایمیل دیرین</span><span>↗</span>
            </a>
        </div>

    </div>

    <script>
        // ثبت سرویس ورکر برای فعال شدن قابلیت نصب اپلیکیشن
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error', err));
            });
        }

        function checkLogin() {
            if (document.getElementById('passwordInput').value === "admin123") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
                localStorage.setItem('isAdminLoggedIn', 'true');
            } else { document.getElementById('loginError').style.display = 'block'; }
        }
        
        function logout() { 
            localStorage.removeItem('isAdminLoggedIn');
            location.reload(); 
        }

        if (localStorage.getItem('isAdminLoggedIn') === 'true') {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboardBox').style.display = 'block';
        }

        // منطق باز و بسته کردن پنل‌ها (شبیه اپلیکیشن)
        function openPanel(panelId) {
            document.getElementById('mainMenu').style.display = 'none';
            document.querySelectorAll('.inner-panel').forEach(p => p.style.display = 'none');
            
            const panel = document.getElementById(panelId);
            panel.style.display = 'block';

            if (panelId === 'usersPanel') loadAdminUsers();
            if (panelId === 'tasksPanel') loadAdminTasks();
        }

        function closePanel() {
            document.querySelectorAll('.inner-panel').forEach(p => p.style.display = 'none');
            document.getElementById('mainMenu').style.display = 'grid';
        }

        // --- بخش محصولات ---
        async function addProduct() {
            const title = document.getElementById('prodTitle').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const imgFile = document.getElementById('prodImgFile').files[0];
            const imgUrlInput = document.getElementById('prodImgUrl').value.trim();
            const vidFile = document.getElementById('prodVidFile').files[0];
            const vidUrlInput = document.getElementById('prodVidUrl').value.trim();
            
            const btn = document.getElementById('addProductBtn');
            const statusMsg = document.getElementById('productStatusMsg');

            if (!title || !price) {
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = 'لطفاً عنوان و قیمت را وارد کنید.';
                return;
            }

            if (!imgFile && !imgUrlInput) {
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = 'لطفاً عکس محصول را آپلود کنید یا لینک آن را وارد کنید.';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'در حال پردازش... <div class="loader"></div>';
            statusMsg.style.display = 'none';

            let finalImageUrl = imgUrlInput;
            let finalVideoUrl = vidUrlInput;

            try {
                if (imgFile) {
                    btn.innerHTML = 'آپلود عکس... <div class="loader"></div>';
                    const formData = new FormData();
                    formData.append('file', imgFile);
                    const res = await fetch('/api/upload', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'خطا در آپلود عکس');
                    finalImageUrl = data.url;
                }

                if (vidFile) {
                    btn.innerHTML = 'آپلود ویدیو... <div class="loader"></div>';
                    const formData = new FormData();
                    formData.append('file', vidFile);
                    const res = await fetch('/api/upload', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'خطا در آپلود ویدیو');
                    finalVideoUrl = data.url;
                }

                btn.innerHTML = 'ذخیره... <div class="loader"></div>';
                const response = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, price, image_url: finalImageUrl, video_url: finalVideoUrl })
                });

                if (response.ok) {
                    statusMsg.className = 'status-msg success';
                    statusMsg.innerText = '✅ محصول با موفقیت ثبت شد!';
                    document.getElementById('prodTitle').value = '';
                    document.getElementById('prodPrice').value = '';
                    document.getElementById('prodImgFile').value = '';
                    document.getElementById('prodImgUrl').value = '';
                    document.getElementById('prodVidFile').value = '';
                    document.getElementById('prodVidUrl').value = '';
                } else { throw new Error('خطا در ثبت دیتابیس'); }
            } catch (error) {
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = '❌ ' + error.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'ثبت محصول';
            }
        }

        // --- بخش کاربران ---
        async function loadAdminUsers() {
            const usersList = document.getElementById('usersList');
            usersList.innerHTML = '<p style="text-align: center; color: #aaa;">در حال دریافت...</p>';
            
            try {
                const response = await fetch('/api/admin-users');
                const users = await response.json();
                
                usersList.innerHTML = '';
                if (users.length === 0) {
                    usersList.innerHTML = '<p style="text-align: center; color: #777;">هیچ کاربری یافت نشد.</p>';
                    return;
                }
                
                users.forEach(user => {
                    const isSub = user.is_subscribed;
                    const badge = isSub 
                        ? '<span class="badge active">فعال</span>' 
                        : '<span class="badge inactive">غیرفعال</span>';

                    const actionBtn = isSub 
                        ? `<button class="action-btn btn-danger" onclick="toggleSubscription('${user.phone}', false)">لغو اشتراک</button>`
                        : `<button class="action-btn btn-success" onclick="toggleSubscription('${user.phone}', true)">فعال‌سازی اشتراک</button>`;

                    const card = document.createElement('div');
                    card.className = 'manage-card';
                    card.innerHTML = `
                        <h4><span>📱 ${user.phone}</span> ${badge}</h4>
                        <p>دعوت‌ها: <strong>${user.invite_count || 0}</strong> از 15</p>
                        <p>معرف: ${user.referred_by || 'ندارد'}</p>
                        <div style="margin-top: 12px;">${actionBtn}</div>
                    `;
                    usersList.appendChild(card);
                });
            } catch (error) {
                usersList.innerHTML = '<p style="text-align: center; color: red;">خطا در دریافت اطلاعات.</p>';
            }
        }

        async function toggleSubscription(phone, status) {
            if (!confirm(`تغییر وضعیت کاربر ${phone}؟`)) return;
            try {
                const res = await fetch('/api/admin-users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, status })
                });
                if (res.ok) { loadAdminUsers(); } 
                else { alert('خطا در تغییر وضعیت'); }
            } catch (error) { alert('ارتباط برقرار نشد.'); }
        }

        // --- بخش میکرو-کارها ---
        async function loadAdminTasks() {
            const tasksList = document.getElementById('tasksList');
            tasksList.innerHTML = '<p style="text-align: center; color: #aaa;">در حال دریافت...</p>';
            try {
                const response = await fetch('/api/tasks');
                const tasks = await response.json();
                tasksList.innerHTML = '';
                if (tasks.length === 0) {
                    tasksList.innerHTML = '<p style="text-align: center; color: #777;">کاری ثبت نشده.</p>';
                    return;
                }
                tasks.forEach(task => {
                    const card = document.createElement('div');
                    card.className = 'manage-card';
                    card.innerHTML = `
                        <h4>${task.title}</h4>
                        <p>${task.description || 'بدون توضیح'}</p>
                        <p>💰 ${task.price || 'توافقی'}</p>
                        <p>📞 ${task.contact}</p>
                    `;
                    tasksList.appendChild(card);
                });
            } catch (error) {
                tasksList.innerHTML = '<p style="text-align: center; color: red;">خطا در دریافت.</p>';
            }
        }
    </script>
</body>
</html>
