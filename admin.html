<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ادمین | همیار زندگی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/tus-js-client@latest/dist/tus.min.js"></script>
    <style>
        :root { --primary: #D4A574; --primary-dark: #b88655; --danger: #E74C3C; --success: #2E8B57; }
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 350px; }
        .login-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; text-align: center; box-sizing: border-box;}
        .login-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .dashboard-container { display: none; width: 100%; max-width: 800px; padding: 20px; box-sizing: border-box; }
        .header-dash { display: flex; justify-content: space-between; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 12px; }
        .logout-btn { background: #fce4e4; color: var(--danger); border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
        .tab-panel { background: white; padding: 20px; border-radius: 15px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background: #f9f9f9; }
        .submit-btn { background: var(--success); color: white; border: none; padding: 12px 20px; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .submit-btn:disabled { opacity: 0.7; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid white; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-msg { text-align: center; padding: 10px; border-radius: 8px; margin-top: 15px; display: none; font-weight: bold; }
        .status-msg.success { background: #d4edda; color: #155724; display: block; }
        .status-msg.error { background: #f8d7da; color: #721c24; display: block; font-size: 12px; word-wrap: break-word;}
    </style>
</head>
<body>
    <div id="loginBox" class="login-container">
        <h2>🔐 ورود</h2>
        <div id="loginError" style="color: var(--danger); display: none; margin-bottom: 10px;">رمز اشتباه است!</div>
        <input type="password" id="passwordInput" class="login-input" placeholder="رمز عبور...">
        <button class="login-btn" onclick="checkLogin()">ورود</button>
    </div>

    <div id="dashboardBox" class="dashboard-container">
        <div class="header-dash">
            <h2>پنل مدیریت</h2>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>

        <div class="tab-panel">
            <h3 style="margin-top: 0; color: var(--primary-dark);">افزودن محصول جدید</h3>
            <div id="productStatusMsg" class="status-msg"></div>

            <div class="form-group"><label>عنوان محصول *</label><input type="text" id="prodTitle" class="form-control"></div>
            <div class="form-group"><label>قیمت *</label><input type="text" id="prodPrice" class="form-control"></div>
            <div class="form-group"><label>انتخاب عکس *</label><input type="file" id="prodImgFile" class="form-control" accept="image/*"></div>
            <div class="form-group"><label>انتخاب ویدیو (اختیاری)</label><input type="file" id="prodVidFile" class="form-control" accept="video/*"></div>
            
            <button class="submit-btn" id="addProductBtn" onclick="addProduct()">ثبت محصول</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://grfeyftvktknbrphphafqf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyZmV5ZnR2a3RuYnJwaHBoYWZxZiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzkyNTI3MDM4LCJleHAiOjIxMDgxMDMwMzh9.Pl7iuL3kJFNPGoW2NMPIm88jGBRYHiaJQuROjGdPZ-M";
        
        function checkLogin() {
            if (document.getElementById('passwordInput').value === "admin123") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
            } else { document.getElementById('loginError').style.display = 'block'; }
        }
        function logout() { location.reload(); }

        async function uploadFile(file, btnElement) {
            if (!file) return null;
            const fileName = `${Date.now()}_${file.name.replace(/\s/g, '_')}`;
            const endpoint = `${SUPABASE_URL}/storage/v1/upload/resumable`;

            return new Promise((resolve, reject) => {
                const upload = new tus.Upload(file, {
                    endpoint: endpoint,
                    retryDelays: [0, 3000],
                    headers: { authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'x-upsert': 'true' },
                    uploadDataDuringCreation: true,
                    removeFingerprintOnSuccess: true,
                    metadata: { bucketName: 'products', objectName: fileName, contentType: file.type, cacheControl: '3600' },
                    chunkSize: 6 * 1024 * 1024,
                    onError: function (error) {
                        // این خط دقیقا به ما میگه چه خبره
                        alert("خطای آپلود: " + (error.message || JSON.stringify(error)));
                        reject(new Error("خطا در آپلود"));
                    },
                    onProgress: function (b, t) {
                        btnElement.innerHTML = `در حال آپلود: ${((b / t) * 100).toFixed(1)}% <div class="loader"></div>`;
                    },
                    onSuccess: function () {
                        resolve(`${SUPABASE_URL}/storage/v1/object/public/products/${fileName}`);
                    },
                });

                upload.findPreviousUploads().then(function (prev) {
                    if (prev.length) upload.resumeFromPreviousUpload(prev[0]);
                    upload.start();
                });
            });
        }

        async function addProduct() {
            const title = document.getElementById('prodTitle').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const imgFile = document.getElementById('prodImgFile').files[0];
            const vidFile = document.getElementById('prodVidFile').files[0];
            
            const btn = document.getElementById('addProductBtn');
            const statusMsg = document.getElementById('productStatusMsg');

            if (!title || !price || !imgFile) {
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = 'لطفاً عنوان، قیمت و عکس را وارد کنید.';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'آماده‌سازی...';
            statusMsg.style.display = 'none';

            try {
                const image_url = await uploadFile(imgFile, btn);
                let video_url = "";
                if (vidFile) video_url = await uploadFile(vidFile, btn);

                btn.innerHTML = 'ذخیره در دیتابیس... <div class="loader"></div>';
                const res = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, price, image_url, video_url })
                });

                if (res.ok) {
                    statusMsg.className = 'status-msg success';
                    statusMsg.innerText = '✅ محصول با موفقیت ثبت شد!';
                    document.getElementById('prodTitle').value = '';
                    document.getElementById('prodPrice').value = '';
                } else { throw new Error('خطا در ثبت نهایی'); }
            } catch (error) {
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = '❌ ' + error.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'ثبت محصول';
            }
        }
    </script>
</body>
</html>
